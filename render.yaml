# Render Blueprint for the backend. The frontend is deployed separately on Vercel
# (see README) because Vercel's free tier hosts Next.js better than Render's does.
#
# Everything here fits inside Render's free plan. The trade-off of the free plan
# is that the instance sleeps after 15 minutes idle and cold-starts in roughly a
# minute — the frontend is written to show that as "waking up" rather than fail.
services:
  - type: web
    name: ai-future-process-designer-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      # Set these in the Render dashboard; they are intentionally not synced from the repo.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Session-token signing key. `generateValue` makes Render mint a random one
      # on first deploy, so a real secret never lives in this file.
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_DEMO_ACCOUNT_ENABLED
        value: "false"
      # The deployed frontend origin, e.g. https://future-process-designer.vercel.app
      # Wildcards are supported, so https://*.vercel.app also covers preview deployments.
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "3"
      # Matches the application default. The lite model is deliberate: the full Flash
      # models allow only ~20 requests a day on the free tier. Raise it here if you have
      # the quota and want the richer analysis.
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Thinking tokens are charged against the same free allowance and this task does
      # not need them.
      - key: GEMINI_THINKING_BUDGET
        value: "0"
