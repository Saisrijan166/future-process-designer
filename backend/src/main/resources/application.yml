spring:
  application:
    name: ai-future-process-designer

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/future_designer}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      # Neon's free tier allows a small number of connections; a modest pool leaves headroom for
      # migrations and for a second instance during a deploy.
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    open-in-view: false          # DTOs are mapped inside the service layer; no lazy loading in views.
    hibernate:
      ddl-auto: validate         # Flyway owns the schema. Hibernate only checks the mapping matches.
    properties:
      hibernate:
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true              # Analysis requests are long and I/O bound.

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json
  error:
    include-message: never       # Errors are produced by GlobalExceptionHandler, not the default page.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  cors:
    # Comma-separated list. Set APP_CORS_ALLOWED_ORIGINS to the deployed frontend URL.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  analysis:
    # staged = ten stages with live research and an adversarial review; single = the original
    # one-prompt analysis, which costs one request instead of eight.
    pipeline: ${ANALYSIS_PIPELINE:staged}
    knowledge-snippet-count: ${ANALYSIS_SNIPPET_COUNT:4}
    rate-limit:
      enabled: ${ANALYSIS_RATE_LIMIT_ENABLED:true}
      permits-per-minute: ${ANALYSIS_RATE_LIMIT_PER_MINUTE:20}
  ai:
    # The provider tried first, then the ordered fallbacks. Free tiers run out; the chain is what
    # keeps a demo alive when they do.
    provider: ${AI_PROVIDER:gemini}
    fallback-providers: ${AI_FALLBACK_PROVIDERS:groq}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
      temperature: ${GEMINI_TEMPERATURE:0.2}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:8192}
      structured-output: ${GEMINI_STRUCTURED_OUTPUT:true}
      # 0 disables model "thinking". Thinking tokens count against the same free-tier output
      # allowance and this task does not need them. -1 restores the model's own default.
      thinking-budget: ${GEMINI_THINKING_BUDGET:0}
    groq:
      api-key: ${GROQ_API_KEY:}
      # Verified against Groq's live free tier. Model ids move: the previous default,
      # llama-3.3-70b-versatile, has been decommissioned. Per-task routing overrides this
      # for most stages; it is the fallback when a route names a model that is gone.
      model: ${GROQ_MODEL:openai/gpt-oss-120b}
      temperature: ${GROQ_TEMPERATURE:0.2}
      max-output-tokens: ${GROQ_MAX_OUTPUT_TOKENS:4096}
      structured-output: ${GROQ_STRUCTURED_OUTPUT:true}
      # The agentic model used as a research connector: it runs its own web searches and
      # returns the pages it read, which are stored and quote-verified like any other source.
      research-model: ${GROQ_RESEARCH_MODEL:groq/compound}
    # Per-task model routing. Empty here means the defaults in ModelRouter apply; set one
    # to a comma-separated list of provider:model to override, e.g.
    #   AI_ROUTE_DIAGNOSIS=gemini:,groq:openai/gpt-oss-120b
    routing:
      diagnosis: ${AI_ROUTE_DIAGNOSIS:}
      opportunities: ${AI_ROUTE_OPPORTUNITIES:}
      critique: ${AI_ROUTE_CRITIQUE:}
      future-design: ${AI_ROUTE_FUTURE_DESIGN:}
      claim-extraction: ${AI_ROUTE_CLAIM_EXTRACTION:}
      research-agent: ${AI_ROUTE_RESEARCH_AGENT:}
      quantification: ${AI_ROUTE_QUANTIFICATION:}
      risk: ${AI_ROUTE_RISK:}
      roadmap: ${AI_ROUTE_ROADMAP:}
      query-planning: ${AI_ROUTE_QUERY_PLANNING:}
    # Remembered model responses. A restart no longer throws away quota already spent, and
    # re-running an unchanged analysis costs nothing.
    cache-enabled: ${AI_CACHE_ENABLED:true}
    cache-ttl-hours: ${AI_CACHE_TTL_HOURS:72}
    # How long a stage waits for free-tier token budget before trying another model.
    max-rate-limit-wait-seconds: ${AI_MAX_RATE_LIMIT_WAIT_SECONDS:60}

  # ---------------------------------------------------------------------------
  # LIVE RESEARCH
  #
  # Eleven connectors, all free, none requiring an API key. Tavily and Brave are
  # supported and stay dormant unless a key is supplied, so there is no paid
  # dependency anywhere in the default configuration.
  # ---------------------------------------------------------------------------
  research:
    enabled: ${RESEARCH_ENABLED:true}
    max-queries: ${RESEARCH_MAX_QUERIES:5}
    hits-per-query: ${RESEARCH_HITS_PER_QUERY:5}
    # The main lever on how long a fresh analysis takes: each document read costs a model
    # call against an organisation-wide tokens-per-minute ceiling.
    max-documents: ${RESEARCH_MAX_DOCUMENTS:6}
    max-claims: ${RESEARCH_MAX_CLAIMS:24}
    fetch-timeout-seconds: ${RESEARCH_FETCH_TIMEOUT_SECONDS:12}
    fetch-concurrency: ${RESEARCH_FETCH_CONCURRENCY:6}
    document-cache-ttl-hours: ${RESEARCH_DOCUMENT_CACHE_TTL_HOURS:168}
    respect-robots-txt: ${RESEARCH_RESPECT_ROBOTS:true}
    user-agent: ${RESEARCH_USER_AGENT:AssessWiseResearchBot/2.0 (+https://github.com/assesswise/future-designer)}
    # Publishers that refuse server-side requests are retried through a public reader.
    reader-fallback-enabled: ${RESEARCH_READER_FALLBACK:true}
    # Optional keyed search providers. Dormant unless a key is present.
    tavily:
      api-key: ${RESEARCH_TAVILY_API_KEY:}
    brave:
      api-key: ${RESEARCH_BRAVE_API_KEY:}

  auth:
    # Signing key for session tokens. MUST be replaced in production — at least 32 characters.
    #   openssl rand -base64 48
    jwt-secret: ${AUTH_JWT_SECRET:dev-only-insecure-signing-key-change-me-in-production}
    token-ttl-hours: ${AUTH_TOKEN_TTL_HOURS:12}
    demo-account:
      # Creates a known account on first start so the app can be opened without registering.
      # Turn this off anywhere that is not a demo.
      enabled: ${AUTH_DEMO_ACCOUNT_ENABLED:true}
      email: ${AUTH_DEMO_EMAIL:demo@assesswise.test}
      password: ${AUTH_DEMO_PASSWORD:demo12345}
      display-name: ${AUTH_DEMO_DISPLAY_NAME:Demo User}

logging:
  level:
    com.assesswise.processdesigner: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
