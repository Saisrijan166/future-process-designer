spring:
  application:
    name: ai-future-process-designer

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/future_designer}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      # Neon's free tier allows a small number of connections; a modest pool leaves headroom for
      # migrations and for a second instance during a deploy.
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    open-in-view: false          # DTOs are mapped inside the service layer; no lazy loading in views.
    hibernate:
      ddl-auto: validate         # Flyway owns the schema. Hibernate only checks the mapping matches.
    properties:
      hibernate:
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true              # Analysis requests are long and I/O bound.

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json
  error:
    include-message: never       # Errors are produced by GlobalExceptionHandler, not the default page.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  cors:
    # Comma-separated list. Set APP_CORS_ALLOWED_ORIGINS to the deployed frontend URL.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  analysis:
    knowledge-snippet-count: ${ANALYSIS_SNIPPET_COUNT:4}
    rate-limit:
      enabled: ${ANALYSIS_RATE_LIMIT_ENABLED:true}
      permits-per-minute: ${ANALYSIS_RATE_LIMIT_PER_MINUTE:20}
  ai:
    provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.7-flash}
      temperature: ${GEMINI_TEMPERATURE:0.2}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:8192}
      structured-output: ${GEMINI_STRUCTURED_OUTPUT:true}
      # -1 leaves the model's own thinking default in place. Set 0 to disable thinking for speed.
      thinking-budget: ${GEMINI_THINKING_BUDGET:-1}

logging:
  level:
    com.assesswise.processdesigner: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
